<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Viewport & Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/favicon-zoomed.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- Default Meta Tags (will be overridden by React Helmet) -->
    <title>VSneakers - Giày Sneaker Chính Hãng, Giá Tốt Nhất Việt Nam</title>
    <meta name="description" content="VSneakers - Shop giày sneaker chính hãng tại Việt Nam. Nike, Jordan, Adidas, Yeezy, New Balance và hơn 500+ mẫu sneaker hot. Giao hàng toàn quốc, đổi trả 30 ngày, giá tốt nhất." />
    <meta name="keywords" content="sneaker vietnam, giày sneaker, nike air max, jordan 1, adidas yeezy, new balance, giày thể thao, vsneakers, sneaker chính hãng, mua giày online" />
    <meta name="author" content="VSneakers" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.web-apps.live/" />
    <meta property="og:title" content="VSneakers - Giày Sneaker Chính Hãng Việt Nam" />
    <meta property="og:description" content="Shop giày sneaker chính hãng tại Việt Nam. Nike, Jordan, Adidas và hơn 500+ mẫu. Giao hàng toàn quốc." />
    <meta property="og:image" content="https://www.web-apps.live/logo.png" />
    <meta property="og:site_name" content="VSneakers" />
    <meta property="og:locale" content="vi_VN" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.web-apps.live/" />
    <meta name="twitter:title" content="VSneakers - Sneaker Chính Hãng" />
    <meta name="twitter:description" content="Shop giày sneaker chính hãng tại Việt Nam" />
    <meta name="twitter:image" content="https://www.web-apps.live/logo.png" />
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    
    <!-- Google Fonts for VSneakers - Modern Premium Style -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Preload Critical Assets -->
    <link rel="preload" href="/logo.png" as="image" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.web-apps.live/" />
    
    <!-- Language Alternates -->
    <link rel="alternate" hreflang="vi" href="https://www.web-apps.live/" />
    <link rel="alternate" hreflang="x-default" href="https://www.web-apps.live/" />
    
    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    
    <!-- Structured Data - Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "VSneakers",
      "url": "https://www.web-apps.live",
      "logo": "https://www.web-apps.live/logo.png",
      "description": "Cửa hàng giày sneaker chính hãng hàng đầu tại Việt Nam",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "VN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "availableLanguage": ["Vietnamese"]
      }
    }
    </script>
    
    <!-- Structured Data - Website Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VSneakers",
      "url": "https://www.web-apps.live",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.web-apps.live/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <!-- Hidden H1 for SEO -->
    <h1 style="position:absolute;left:-9999px;top:-9999px;">
      VSneakers – Giày Sneaker Chính Hãng Nike, Jordan, Adidas Tại Việt Nam
    </h1>
    
    <!-- Main App Container -->
    <div id="root"></div>
    
    <!-- Main Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
